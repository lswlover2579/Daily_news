<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{
  --bg:#fbfaf7;--panel:#fff;--ink:#15171c;--ink2:#3c414a;--muted:#7a7f88;
  --line:#e6e1d7;--line2:#f0ece4;--accent:#b0432b;--accent2:#f7ece7;
  --hi:#1c7a5b;--warn:#9a6a0d;--warnbg:#fdf6e5;--warnline:#f0dfae;

}
html[data-theme=dark]{
  --bg:#0f1115;--panel:#151821;--ink:#e8eaee;--ink2:#c2c6ce;--muted:#8b909a;
  --line:#262b35;--line2:#1c212a;--accent:#e0795f;--accent2:#2a1c18;
  --hi:#4bbd92;--warn:#e0b055;--warnbg:#221c10;--warnline:#3a2f18;
}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.62 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)){
  header.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(150%) blur(14px)}
}
.bar{display:flex;align-items:center;gap:10px;padding:11px 0 7px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mark{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent2);flex:none}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.sub{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.btn{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink2);background:var(--panel);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5}
.icon{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;font-size:13px;background:var(--panel)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:8px 0 0;font-variant-numeric:tabular-nums}
.dot{width:5px;height:5px;border-radius:50%;background:var(--hi);flex:none}
.dot.stale{background:var(--warn)}
.tabsbar{position:sticky;top:var(--hh,48px);z-index:19;background:var(--bg);transition:transform .22s ease,opacity .22s ease}
.tabsbar.hide{transform:translateY(-140%);opacity:0;pointer-events:none}
.tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 0 8px}
.tab{white-space:nowrap;font-size:12px;line-height:1.75;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--panel);transition:background .15s,color .15s}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.kw{color:var(--accent)}
.tab.kw.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabbr{flex:0 0 100%;height:0}

/* sections */
.glabel{margin:26px 0 -4px;font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.sec{padding:20px 0 4px;border-top:1px solid var(--line2);scroll-margin-top:70px}
.sec:first-of-type{border-top:0}
.glabel + .sec{border-top:0}
.hrow{display:flex;align-items:center;gap:7px}
.k{color:var(--accent);font-family:var(--mono);font-size:12px;line-height:1}
h2{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em}
.sec-n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.sec-d{margin:3px 0 12px;font-size:11.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}

.totop{position:fixed;left:0;top:0;z-index:45;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink2);display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .18s;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.totop.show{opacity:1;pointer-events:auto}
.totop.drag{cursor:grabbing;box-shadow:0 8px 22px rgba(0,0,0,.24)}
.totop:active{background:var(--accent2);color:var(--accent);border-color:var(--accent)}

@media (max-width:360px){
  .wrap{padding:0 14px}
  h3{font-size:15.4px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>

  function pad(n){ return (n<10?'0':'')+n; }

  function fmtDate(d){
    var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+w;
  }
  function fmtTime(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var now = new Date();
    var y = new Date(now.getTime() - 864e5);
    var hm = pad(d.getHours())+':'+pad(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return '今天 '+hm;
    if (d.toDateString() === y.toDateString()) return '昨天 '+hm;
    return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  }
  function dayKey(iso){
    var d = new Date(iso);
    return isNaN(d) ? 'x' : d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  }
  function dayLabel(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '更早';
    var now = new Date();
    var y = new Date(now.getTime() - 864e5);
    if (d.toDateString() === now.toDateString()) return '今天';
    if (d.toDateString() === y.toDateString()) return '昨天';
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
  }
  function ageText(h){
    if (h < 0.15) return '刚刚更新';
    if (h < 1) return '更新于 ' + Math.max(1, Math.round(h*60)) + ' 分钟前';
    if (h < 24) return '更新于 ' + Math.round(h) + ' 小时前';
    return '更新于 ' + Math.round(h/24) + ' 天前';
  }

  function itemHTML(it, i, showPool){
    var imp = it.importance || 1;
    var read = readSet.has(it.id);
    var title = it.url
      ? '<a class="t" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a>'
      : '<span>'+esc(it.title)+'</span>';
    var meta = '';
    if (it.sample) meta += '<span class="tag sample">示例</span>';
    if (showPool && it._pool) meta += '<span class="src">'+esc(it._pool)+'</span><span class="sep">·</span>';
    meta += '<span class="src">'+esc(it.source||'未知来源')+'</span>';
    meta += '<span class="sep">·</span><time datetime="'+esc(it.publishedAt)+'">'+fmtTime(it.publishedAt)+'</time>';
    if (it.alsoCount > 1) meta += '<span class="also">同题 '+(it.alsoCount-1)+' 家</span>';
    meta += '<span class="imp i'+imp+'" title="重要程度 '+imp+'/3">'+new Array(imph(imp)+1).join('●')+'</span>';

    var dp = '';
    if (it.context) dp += '<div class="blk"><h4>背景</h4><p>'+esc(it.context)+'</p></div>';
    else if (it.excerpt) dp += '<div class="blk"><h4>原文摘录</h4><p>'+esc(it.excerpt)+'</p></div>';
    if (it.impact) dp += '<div class="blk imp-blk"><h4>市场影响</h4><p>'+esc(it.impact)+'</p></div>';
    if (it.tags && it.tags.length) dp += '<div class="tags">'+it.tags.map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('')+'</div>';
    if (it.sample) dp += '<p class="note">示例条目，非真实新闻。</p>';

    var more = dp ? '<button class="mb" type="button" aria-expanded="false"><span>背景与市场影响</span><i>+</i></button><div class="dp" hidden>'+dp+'</div>' : '';

    return '<li class="item'+(read?' is-read':'')+(onlyUnread&&read?' hide-unread':'')+'" data-id="'+esc(it.id)+'">'
      + '<span class="rk">'+(i+1)+'</span>'
      + '<div class="bd"><div class="ttlrow"><div class="ttl-main"><h3>'+title+'</h3>'
      + (it.titleZh ? '<p class="zh">' + (it.url ? '<a class="t" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">'+esc(it.titleZh)+'</a>' : esc(it.titleZh)) + '</p>' : '')
      + '</div><button class="copy" type="button" data-id="'+esc(it.id)+'" aria-label="复制这条新闻" title="复制标题、摘要与链接">复制</button></div>'
      + '<div class="mt">'+meta+'</div>'
      + (it.summary ? '<p class="sm">'+esc(it.summary)+'</p>' : '')
      + more
      + '</div></li>';
  }
  function imph(imp){ return imp>=3?3:(imp===2?2:1); }

  function sectionHTML(pool, id, kind){
    var items = (pool.items||[]).slice();
    if (onlyUnread) items = items.filter(function(it){ return !readSet.has(it.id); });
    var head = '<section class="sec" id="sec-'+esc(id)+'">'
      + '<div class="hrow"><span class="k">'+(kind==='kw'?'#':'§')+'</span><h2>'+esc(pool.name)+'</h2>'
      + '<span class="sec-n">'+(items.length||0)+'</span></div>'
      + '<p class="sec-d">'+esc(pool.desc||'')+'</p>';
    if (!items.length) {
      return head + '<p class="empty">'+(onlyUnread?'没有未读条目。':((D&&D.demoFallback)?'离线演示未填充这一栏，部署后自动更新。':'今日暂无更新。'))+'</p></section>';
    }
    var body = '<ol class="list">';
    var prev = '';
    items.forEach(function(it, i){
      var dk = dayKey(it.publishedAt);
      if (dk !== prev) { body += '<li class="daybreak"><span>'+dayLabel(it.publishedAt)+'</span></li>'; prev = dk; }
      body += itemHTML(it, i, kind === 'top');
    });
    body += '</ol>';
    return head + body + '</section>';
  }

  function topItems(d){
    var all = [];
    (d.categories||[]).concat(d.keywords||[]).forEach(function(p){
      (p.items||[]).forEach(function(it){ all.push(Object.assign({}, it, {_pool:p.name})); });
    });
    all.sort(function(a,b){ return (b.score||0)-(a.score||0) || (new Date(b.publishedAt)-new Date(a.publishedAt)); });
    var seen = new Set(), out = [];
    for (var i=0;i<all.length && out.length<10;i++){
      var k = norm(all[i].title);
      if (!k || seen.has(k)) continue;
      seen.add(k); out.push(all[i]);
    }
    return out;
  }

  function render(){
    var d = D;
    $('#dateLabel').textContent = fmtDate(new Date());
    var items = [], sources = {}, seenIds = {};
    (d.categories||[]).concat(d.keywords||[]).forEach(function(p){
      (p.items||[]).forEach(function(it){
        if (!seenIds[it.id]) { seenIds[it.id] = 1; items.push(it); }
        if (it.source) sources[it.source]=1;
      });
    });
    var gen = d.generatedAt ? new Date(d.generatedAt) : null;
    var ageH = gen && !isNaN(gen) ? (Date.now()-gen.getTime())/36e5 : 999;
    var fresh = ageH < 20;
    var parts = ['<span class="dot'+(fresh?'':' stale')+'"></span>',
      '<span>'+(gen?ageText(ageH):'数据时间未知')+'</span>','<span class="sep">·</span>',
      '<span>'+items.length+' 条</span>'];
    if (Object.keys(sources).length > 1) parts.push('<span class="sep">·</span><span>'+Object.keys(sources).length+' 家来源</span>');
    if (d.windowHours) parts.push('<span class="sep">·</span><span>时间窗 '+(d.windowHours<24?d.windowHours+' 小时':Math.round(d.windowHours/24)+' 天')+'</span>');
    $('#metaLine').innerHTML = parts.join('');

    var tabs = ['<button class="tab on" data-go="sec-top">总览</button>'];
    (d.categories||[]).forEach(function(p){ tabs.push('<button class="tab" data-go="sec-'+esc(p.id)+'">'+esc(p.name)+'</button>'); });
    tabs.push('<span class="tabbr"></span>');
    (d.keywords||[]).forEach(function(p){ tabs.push('<button class="tab kw" data-go="sec-'+esc(p.id)+'">#'+esc(p.name)+'</button>'); });
    $('#tabs').innerHTML = tabs.join('');

    IDX = {};
    (d.categories||[]).concat(d.keywords||[]).forEach(function(p){
      (p.items||[]).forEach(function(it){ if (!IDX[it.id]) IDX[it.id] = Object.assign({_pool:p.name}, it); });
    });

    var html = '';
    if (d.demoFallback) {
      html += '<div class="banner"><b>离线版式演示</b> · 这里只有少量内置示例，不是真实新闻。'
        + '部署到 GitHub Pages 后，页面会自动读取 data.json 显示当日资讯。'
        + (lastError ? '<br><span style="opacity:.75">读取 data.json 失败：' + esc(lastError) + '</span>' : '') + '</div>';
    } else if (d.sample) {
      html += '<div class="banner"><b>示例数据</b> · 这一版用于预览版式与交互，条目不是真实新闻。'
        + '运行一次抓取（GitHub Actions 或 <code>node fetch-news.mjs</code>）后会自动替换为当日真实资讯。</div>';
    }
    if (ageH >= 20 && !d.sample) {
      html += '<div class="banner">数据已有 ' + Math.round(ageH/24) + ' 天未更新，自动任务可能失败了。请到仓库 Actions 页面查看运行日志。</div>';
    }
    html += sectionHTML({name:'今日要闻', desc:'跨栏目精选 · 按重要程度排序', items: topItems(d)}, 'top', 'top');
    html += '<div class="glabel">每日综合新闻</div>';
    (d.categories||[]).forEach(function(p){ html += sectionHTML(p, p.id, 'cat'); });
    html += '<div class="glabel">个人关键词追踪</div>';
    (d.keywords||[]).forEach(function(p){ html += sectionHTML(p, p.id, 'kw'); });
    $('#main').innerHTML = html;
    $('#foot').hidden = false;
    spy();
  }

  function showError(err){
    $('#metaLine').innerHTML = '<span class="dot stale"></span><span>数据加载失败</span>';
    $('#main').innerHTML = '<div class="banner"><b>读不到 data.json</b><br>'
      + '原因：' + esc(err && err.message ? err.message : 'unknown') + '<br><br>'
      + '排查：<br>1. 确认 <code>data.json</code> 和 <code>index.html</code> 在同一目录；<br>'
      + '2. 不要用 <code>file://</code> 直接打开，请在目录里运行 <code>python3 -m http.server 8080</code> 再访问 <code>localhost:8080</code>；<br>'
      + '3. 部署到 GitHub Pages 后刷新一次。</div>';
  }

  function headerH(){ var h = document.querySelector('header.top'); return h ? h.offsetHeight : 120; }
  function spy(){
    var secs = Array.prototype.slice.call(document.querySelectorAll('.sec'));
    if (!secs.length) return;
    var cur = secs[0];
    var line = headerH() + 24;
    secs.forEach(function(s){ if (s.getBoundingClientRect().top <= line) cur = s; });
    var tabs = document.querySelectorAll('.tab');
    Array.prototype.forEach.call(tabs, function(t){ t.classList.toggle('on', t.getAttribute('data-go') === cur.id); });
  }

  // events
  document.addEventListener('click', function(e){
    var cp = e.target.closest('.copy');
    if (cp){
      var item = IDX[cp.getAttribute('data-id')];
      if (item){
        copyText(payload(item)).then(function(ok){ toast(ok ? '已复制标题与链接' : '复制失败，请长按标题'); });
      }
      return;
    }
    var b = e.target.closest('.mb');
    if (b){
      var dp = b.nextElementSibling;
      if (dp){ var open = !dp.hidden; dp.hidden = open; b.classList.toggle('on', !open); b.setAttribute('aria-expanded', String(!open)); }
      return;
    }
    var a = e.target.closest('a.t');
    if (a){
      var li = a.closest('.item');
      if (li && li.dataset.id){ readSet.add(li.dataset.id); li.classList.add('is-read'); saveRead(); }
    }
    var tab = e.target.closest('.tab');
    if (tab){
      var el = document.getElementById(tab.getAttribute('data-go'));
      if (el){
        navLock = performance.now() + 900;
        setNav(true);
        var y = el.getBoundingClientRect().top + window.pageYOffset - headerH() - 12;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    }
  });

  var ticking = false;
  var lastY = window.pageYOffset;
  var lastDir = 0;
  var navLock = 0;
  function setNav(hide){
    var b = document.getElementById('tabsBar');
    if (b) b.classList.toggle('hide', hide);
  }
  if (window.pageYOffset > 140) setNav(true);
  function syncHeader(){
    var h = headerH();
    document.documentElement.style.setProperty('--hh', h + 'px');
  }
  syncHeader();
  window.addEventListener('resize', syncHeader);
  function onScroll(){
    var y = window.pageYOffset;
    if (y < 40) { navLock = 0; lastDir = 0; setNav(false); }
    else {
      var dy = y - lastY;
      if (Math.abs(dy) > 6){
        var dir = dy > 0 ? 1 : -1;
        if (dir !== lastDir){
          lastDir = dir;
          setNav(dir === 1 && y > 140);
        }
        lastY = y;
      }
      if (performance.now() < navLock) setNav(true);
    }
    var tt = document.getElementById('toTop');
    if (tt) tt.classList.toggle('show', y > 600);
    spy();
  }
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){ ticking = false; onScroll(); });
  }, { passive: true });

  // theme
  function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('brief.theme', t); } catch(e){} }
  (function(){
    var saved = null;
    try { saved = localStorage.getItem('brief.theme'); } catch(e){}
    if (saved) applyTheme(saved);
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
  })();
  $('#themeBtn').addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  $('#clearRead').addEventListener('click', function(){
    readSet.clear(); saveRead();
    document.querySelectorAll('.item').forEach(function(li){ li.classList.remove('is-read'); });
  });
  $('#onlyUnread').addEventListener('click', function(){
    onlyUnread = !onlyUnread;
    this.textContent = onlyUnread ? '显示全部' : '只看未读';
    if (D) render();
  });

  var loading = false;
  var lastError = '';
  function loadDemo(){
    try {
      var el = document.getElementById('demoData');
      return el ? JSON.parse(el.textContent) : null;
    } catch (e) { return null; }
  }
  async function boot(){
    if (loading) return;
    loading = true;
    var btn = $('#refreshBtn');
    btn.disabled = true; btn.textContent = '刷新中';
    try {
      var r = await fetch('data.json?ts=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      D = await r.json();
      render();
    } catch (err){
      lastError = err && err.message ? err.message : String(err);
      var demo = loadDemo();
      if (demo){
        D = demo; D.demoFallback = true; D.generatedAt = new Date().toISOString();
        render();
      } else {
        showError(err);
      }
    } finally {
      loading = false; btn.disabled = false; btn.textContent = '刷新';
    }
  }
  // 回到顶部悬浮球：可拖动，位置记忆
  var topBtn = document.getElementById('toTop');
  var BTN_SIZE = 46;
  var SNAP_EDGE = true;          // 松手吸附左右边缘；改成 false 就是完全自由
  var dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, suppressClick = 0;

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function setBtnPos(x, y){
    var vw = window.innerWidth, vh = window.innerHeight;
    var minY = headerH() + 8;
    topBtn.style.left = Math.round(clamp(x, 8, vw - BTN_SIZE - 8)) + 'px';
    topBtn.style.top = Math.round(clamp(y, minY, vh - BTN_SIZE - 8)) + 'px';
  }
  function saveBtnPos(){
    try {
      localStorage.setItem('brief.btn', JSON.stringify({
        x: parseInt(topBtn.style.left, 10) || 0,
        y: parseInt(topBtn.style.top, 10) || 0
      }));
    } catch(e){}
  }
  (function initBtnPos(){
    var p = null;
    try { p = JSON.parse(localStorage.getItem('brief.btn') || 'null'); } catch(e){}
    if (!p || typeof p.x !== 'number' || typeof p.y !== 'number'){
      p = { x: window.innerWidth - BTN_SIZE - 14, y: Math.round(window.innerHeight * 0.6) };
    }
    setBtnPos(p.x, p.y);
  })();

  topBtn.addEventListener('pointerdown', function(e){
    if (e.button && e.button !== 0) return;
    var r = topBtn.getBoundingClientRect();
    dragging = true; moved = false;
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    sx = e.clientX; sy = e.clientY;
    topBtn.classList.add('drag');
    try { topBtn.setPointerCapture(e.pointerId); } catch(err){}
  });
  topBtn.addEventListener('pointermove', function(e){
    if (!dragging) return;
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 6) moved = true;
    if (!moved) return;
    e.preventDefault();
    setBtnPos(e.clientX - ox, e.clientY - oy);
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    topBtn.classList.remove('drag');
    if (moved){
      suppressClick = Date.now() + 400;
      if (SNAP_EDGE){
        var r = topBtn.getBoundingClientRect();
        var toLeft = (r.left + BTN_SIZE / 2) < window.innerWidth / 2;
        setBtnPos(toLeft ? 12 : window.innerWidth - BTN_SIZE - 12, r.top);
      }
      saveBtnPos();
    }
  }
  topBtn.addEventListener('pointerup', endDrag);
  topBtn.addEventListener('pointercancel', endDrag);

  topBtn.addEventListener('click', function(){
    if (Date.now() < suppressClick) return;
    navLock = performance.now() + 700;
    setNav(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  window.addEventListener('resize', function(){
    var r = topBtn.getBoundingClientRect();
    setBtnPos(r.left, r.top);
    saveBtnPos();
  });

  $('#refreshBtn').addEventListener('click', boot);
  boot();
})();
</script>
</body>
</html>
