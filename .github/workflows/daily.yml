# 放到仓库的 .github/workflows/daily.yml
name: 每日情报更新

on:
  schedule:
    # UTC
    - cron: "0 0,3,7,12,21 * * *"
  workflow_dispatch: {}   # 支持手动点一下立即更新

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取并生成 data.json
        env:
          # 可选：配置后自动生成 60~100 字摘要与市场影响（不配也能跑，摘要改为原文摘录）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 通知开关与渠道：Variables 中设置 NOTIFY_ENABLED=true 和 NOTIFY_CHANNELS=telegram（或 feishu,email）
          NOTIFY_ENABLED: ${{ vars.NOTIFY_ENABLED }}
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS }}
          # 按所选渠道配置对应 Secrets；未使用的渠道可以留空
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node fetch-news.mjs

      - name: 提交数据
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 $(date -u +%Y-%m-%d) 情报数据"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
