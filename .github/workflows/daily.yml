# ⚠️ 请把这个文件放到仓库的  .github/workflows/daily.yml
# GitHub 网页端：Add file → Create new file → 文件名输入 .github/workflows/daily.yml → 粘贴本文件内容
name: 每日情报更新

on:
  schedule:
    # UTC 22:30 = 北京时间次日 06:30
    - cron: "30 22 * * *"
    # UTC 09:00 = 北京时间 17:00
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取并生成 data.json
        env:
          # 可选：配置后自动生成 60~100 字摘要与市场影响（不配也能跑，摘要改为原文摘录）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: node fetch-news.mjs

      - name: 提交数据
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 $(date -u +%Y-%m-%d) 情报数据"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
